<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEX3D | Impresión 3D</title><meta name="color-scheme" content="dark"><meta name="theme-color" content="#060608">
<meta name="description" content="Impresión 3D de calidad: deco, organizadores, llaveros, figuras y diseños personalizados.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--pn:#0e0e12;--ln:#1e1e26;--red:#e0002b;--ink:#fff;--mu:#8d8d99;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.dsp{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:800;text-transform:uppercase;margin:0;line-height:1.05}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
em{font-style:normal;color:var(--red)}svg{flex:none}
.w{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(6,6,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-size:1.25rem;font-family:Archivo;font-stretch:115%;font-weight:900}
nav{display:flex;gap:26px}nav a{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);padding:6px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{color:#fff;border-color:var(--red)}
.ic{display:flex;gap:6px}.ib{position:relative;background:none;border:0;padding:8px;border-radius:10px}.ib:hover{background:var(--pn)}
.cnt{position:absolute;top:0;right:0;background:var(--red);font-size:.62rem;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;font-weight:700}
#sb{display:none;border-top:1px solid var(--ln);padding:10px 0}#sb.on{display:block}
input,textarea,select{width:100%;background:var(--pn);color:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ln);background:none}
.btn.r{background:var(--red);border-color:var(--red)}.btn:hover{filter:brightness(1.15)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;min-height:520px;padding:50px 0}
.hero .bar{width:28px;height:2px;background:var(--red);margin-bottom:22px}
.hero h1{font-size:clamp(3.2rem,9vw,6rem);margin-bottom:18px}
.hero h2{font-size:1.4rem;margin-bottom:14px}.hero p{color:var(--mu);max-width:42ch}
.hero .bs{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hv{position:relative}.hv img{width:100%;max-width:520px;display:block;margin:auto;mask-image:radial-gradient(closest-side,#000 70%,transparent)}
.cd{position:absolute;top:4%;right:0;width:230px;background:rgba(18,18,22,.9);border:1px solid var(--ln);border-radius:16px;padding:16px}
.cd b{display:block;font-family:Archivo;font-stretch:112%;font-size:.78rem;text-transform:uppercase}.cd p{font-size:.75rem;color:var(--mu);margin:8px 0}.cd i{font-style:normal;color:var(--red);font-size:.68rem;letter-spacing:.1em}
.ft{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));border-block:1px solid var(--ln)}
.ft div{display:flex;gap:12px;padding:20px 14px;border-right:1px solid var(--ln)}.ft svg{color:var(--red)}
.ft b{font-size:.82rem;display:block}.ft span{font-size:.75rem;color:var(--mu);display:block;line-height:1.4}
section.s{padding:56px 0}.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.sh h2{font-size:clamp(1.5rem,4vw,2.1rem)}
.sh a{color:var(--red);font-size:.72rem;font-weight:700;letter-spacing:.1em}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.cat{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}.cat:hover{border-color:var(--red)}
.cat .t{aspect-ratio:1;border-radius:16px;background:#131318;display:grid;place-items:center;margin-bottom:10px}
.cat .t span{width:58%;aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#ff2850,#a30020);display:grid;place-items:center;box-shadow:0 8px 30px rgba(224,0,43,.35)}
.cat b{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}.cat small{color:var(--mu);font-size:.75rem;line-height:1.35}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pm{aspect-ratio:1;border-radius:12px;background:#0a0a0d;display:grid;place-items:center;overflow:hidden;color:#33333c;margin-bottom:8px}
.pm img,.pm video{width:100%;height:100%;object-fit:cover}
.pc small{color:var(--red);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:0 4px}
.pc h3{font-size:.95rem;padding:0 4px}.pc p{color:var(--mu);font-size:.8rem;margin:0;padding:0 4px;flex:1}
.pf{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px}
.add{background:var(--red);border:0;border-radius:99px;padding:7px 14px;font-size:.72rem;font-weight:700}
.vb{background:none;border:0;color:var(--mu);font-size:.72rem;text-align:left;padding:0 4px}
.tag{position:absolute;top:20px;left:20px;z-index:2;background:var(--red);font-size:.62rem;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.08em}
.pnl{background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:34px;display:flex;gap:34px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pnl h2{font-size:clamp(1.5rem,4vw,2.1rem);margin-bottom:12px}.pnl p{color:var(--mu);max-width:42ch}
.steps{display:flex;gap:26px;flex-wrap:wrap}.steps div{max-width:160px}.steps b{display:block;color:var(--red);font-size:.75rem;text-transform:uppercase}.steps span{font-size:.78rem;color:var(--mu)}
.cta img{height:130px;border-radius:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}.chip.on{background:var(--red);border-color:var(--red)}
.media{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.media img,.media video{width:100%;border-radius:16px;border:1px solid var(--ln)}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px}
.ct a.row,.ct .row{display:flex;gap:12px;align-items:center;padding:12px 0;color:var(--mu)}.ct .row svg{color:var(--red)}
.ph{padding:50px 0 10px}.ph h1{font-size:clamp(2rem,6vw,3.4rem)}.ph p{color:var(--mu);max-width:56ch;margin-top:12px}
footer{border-top:1px solid var(--ln);margin-top:40px;padding:44px 0 26px}
.fg{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:30px}.fg h4{font-size:.68rem;letter-spacing:.14em;color:var(--mu);margin:0 0 12px;text-transform:uppercase}
.fg a,.fg span{display:flex;gap:8px;align-items:center;color:#d6d6de;font-size:.85rem;padding:3px 0}.fg svg{color:var(--red)}
.cp{text-align:center;color:var(--mu);font-size:.75rem;margin-top:30px;padding-top:20px;border-top:1px solid var(--ln)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:none}#ov.on{display:block}
#cdw{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--pn);z-index:31;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;border-left:1px solid var(--ln)}#cdw.on{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--ln)}
#ci{flex:1;overflow:auto;padding:16px 20px}.ci{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.qt{display:flex;align-items:center;gap:8px}.qt button{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);background:none}
.cf{padding:18px 20px;border-top:1px solid var(--ln)}
dialog{background:#000;border:1px solid var(--ln);border-radius:16px;padding:10px;max-width:min(760px,94vw)}dialog::backdrop{background:rgba(0,0,0,.8)}dialog video{width:100%;display:block;border-radius:10px}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}.fg{grid-template-columns:1fr 1fr}.hb{flex-wrap:wrap;height:auto;padding:10px 0}nav{order:3;width:100%;overflow-x:auto;gap:18px;padding-bottom:4px}.cd{position:static;width:100%;margin-top:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="w"><div class="hb"><a class="logo" id="lg" href="#/"></a><nav id="nv"></nav>
<div class="ic"><button class="ib" id="sbtn" aria-label="Buscar"></button><button class="ib" id="cbtn" aria-label="Carrito"></button></div></div>
<div id="sb"><input id="sq" type="search" placeholder="Buscar productos…" aria-label="Buscar productos"></div></div></header>
<main id="app"></main><footer><div class="w" id="ft"></div></footer>
<div id="ov"></div><aside id="cdw" aria-label="Carrito"></aside><dialog id="dlg"></dialog>
<script>
const I={box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11Z"/>',flower:'<circle cx="12" cy="12" r="2.5"/><path d="M12 9.5C10 6 10 4 12 3c2 1 2 3 0 6.5M14.5 12c3.5-2 5.5-2 6.5 0-1 2-3 2-6.5 0M12 14.5c2 3.5 2 5.5 0 6.5-2-1-2-3 0-6.5M9.5 12C6 14 4 14 3 12c1-2 3-2 6.5 0"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M14 9l2 2"/>',shapes:'<path d="M8 3 3 12h10Z"/><circle cx="17" cy="17" r="4"/><path d="M3 15h6v6H3z"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',sparkle:'<path d="M12 3c.5 5 1.5 6.5 7 9-5.5 2.5-6.5 4-7 9-.5-5-1.5-6.5-7-9 5.5-2.5 6.5-4 7-9Z"/>',cart:'<path d="M3 4h2l2.5 11h11L21 7H6"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',wa:'<path d="M3 21l1.6-5A8.5 8.5 0 1 1 8 19.5Z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .8c-1-.5-2-1.5-2.5-2.5l.8-1-1-2Z"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.box}</svg>`;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
let D,cart=[],q='';
try{cart=JSON.parse(localStorage.getItem('a3d_cart')||'[]')}catch(x){}
const save=()=>{try{localStorage.setItem('a3d_cart',JSON.stringify(cart))}catch(x){}};
const money=n=>n>0?'$'+Number(n).toLocaleString('es-AR'):'Consultar';
const wa=t=>`https://wa.me/${e(D.contact.wa)}?text=${encodeURIComponent(t)}`;
const brand=s=>e(s).replace(/3D$/i,'<em>3D</em>');
const cat=id=>D.categories.find(c=>c.id===id)||{name:'',icon:'box'};
const vis=()=>D.products.filter(p=>!p.hidden);
const card=p=>{const c=cat(p.cat);return `<article class="pc">${p.featured?'<b class="tag">Destacado</b>':''}<div class="pm">${p.image?`<img loading="lazy" src="${e(p.image)}" alt="${e(p.name)}">`:p.video?`<video src="${e(p.video)}" muted loop playsinline controls preload="metadata"></video>`:ic(c.icon,48)}</div>
<small>${e(c.name)}</small><h3>${e(p.name)}</h3><p>${e(p.desc)}</p>${p.video&&p.image?`<button class="vb" data-vid="${e(p.video)}">▶ Ver video</button>`:''}<div class="pf"><strong>${money(p.price)}</strong><button class="add" data-add="${e(p.id)}">Agregar</button></div></article>`};
const secs=()=>(D.sections||[]).map(s=>`<section class="s"><div class="w"><div class="sh"><h2>${e(s.title)}</h2></div><p style="color:var(--mu);max-width:60ch;margin:-10px 0 20px">${e(s.text)}</p><div class="media">${(s.media||[]).map(m=>m.type==='video'?`<video controls playsinline preload="metadata" src="${e(m.src)}"></video>`:`<img loading="lazy" alt="${e(s.title)}" src="${e(m.src)}">`).join('')}</div></div></section>`).join('');
const V={
inicio(){const h=D.hero,f=vis().filter(p=>p.featured);return `<div class="w"><div class="hero"><div><div class="bar"></div><h1>${brand(D.brand)}</h1><h2>${e(h.tagline)} <em>${e(h.accent)}</em></h2><p>${e(h.text)}</p>
<div class="bs"><a class="btn r" href="#/productos">${e(h.btn1)} →</a><a class="btn" href="#/personalizados">${e(h.btn2)}</a></div></div>
<div class="hv">${h.image?`<img src="${e(h.image)}" alt="${e(D.brand)}">`:''}<div class="cd"><b>${e(h.cardTitle)}<br>${e(h.cardTitle2)}</b><p>${e(h.cardText)}</p><i>${e(h.cardTag)}</i></div></div></div></div>
<div class="w"><div class="ft">${D.features.map(x=>`<div>${ic(x.icon,26)}<p style="margin:0"><b>${e(x.t)}</b><span>${e(x.d)}</span></p></div>`).join('')}</div></div>
<section class="s"><div class="w"><div class="cats">${D.categories.map(c=>`<a class="cat" href="#/productos/${e(c.id)}"><div class="t"><span>${ic(c.icon,34)}</span></div><b>${e(c.name)}</b><small>${e(c.desc)}</small></a>`).join('')}</div></div></section>
${f.length?`<section class="s" style="padding-top:10px"><div class="w"><div class="sh"><h2>Productos <em>destacados</em></h2><a href="#/productos">VER TODOS →</a></div><div class="pg">${f.map(card).join('')}</div></div></section>`:''}
<section class="s" style="padding-top:10px"><div class="w"><div class="pnl"><div><h2>${e(D.how.title)} <em>${e(D.how.accent)}</em></h2><p>${e(D.how.text)}</p><p><a class="btn" href="#/sobre-mi">${e(D.how.btn)}</a></p></div><div class="steps">${D.how.steps.map(s=>`<div><b>${e(s.t)}</b><span>${e(s.d)}</span></div>`).join('')}</div></div></div></section>
${secs()}
<section class="s" style="padding-top:10px"><div class="w"><div class="pnl cta"><div><h2>${e(D.cta.title)} <em>${e(D.cta.accent)}</em></h2><p>${e(D.cta.text)}</p><p><a class="btn r" target="_blank" rel="noopener" href="${wa('Hola! Quiero pedir un diseño personalizado.')}">${e(D.cta.btn)}</a></p></div>${D.cta.image?`<img src="${e(D.cta.image)}" alt="">`:''}</div></div></section>`},
productos(c){const l=vis().filter(p=>(!c||p.cat===c)&&(!q||(p.name+' '+p.desc).toLowerCase().includes(q.toLowerCase())));
return `<div class="w"><div class="ph"><h1>Productos</h1></div><section class="s" style="padding-top:20px"><div class="chips"><a class="chip ${c?'':'on'}" href="#/productos">Todos</a>${D.categories.map(x=>`<a class="chip ${c===x.id?'on':''}" href="#/productos/${e(x.id)}">${e(x.name)}</a>`).join('')}</div>
${l.length?`<div class="pg">${l.map(card).join('')}</div>`:'<p style="color:var(--mu)">No encontramos productos. Probá con otra búsqueda o categoría.</p>'}</div></section>`},
personalizados(){return `<div class="w"><div class="ph"><h1>${e(D.custom.title)}</h1><p>${e(D.custom.text)}</p></div><section class="s"><div class="pnl cta"><div><h2>${e(D.cta.title)} <em>${e(D.cta.accent)}</em></h2><p>${e(D.cta.text)}</p><p><a class="btn r" target="_blank" rel="noopener" href="${wa('Hola! Quiero pedir un diseño personalizado.')}">${e(D.cta.btn)}</a></p></div>${D.cta.image?`<img src="${e(D.cta.image)}" alt="">`:''}</div></section></div>`},
'sobre-mi'(){return `<div class="w"><div class="ph"><h1>${e(D.about.title)}</h1><p>${e(D.about.text)}</p></div>${D.about.image?`<section class="s"><div class="media"><img src="${e(D.about.image)}" alt=""></div></section>`:''}</div>`},
contacto(){const c=D.contact;return `<div class="w"><div class="ph"><h1>Contacto</h1><p>Escribinos y te respondemos a la brevedad.</p></div><section class="s"><div class="ct"><div>
<a class="row" target="_blank" rel="noopener" href="${wa('Hola!')}">${ic('wa')} WhatsApp: ${e(c.phone)}</a><a class="row" href="mailto:${e(c.email)}">${ic('mail')} ${e(c.email)}</a><span class="row">${ic('pin')} ${e(c.city)}</span>${c.ig?`<a class="row" target="_blank" rel="noopener" href="https://www.instagram.com/${e(c.ig)}/">${ic('ig')} @${e(c.ig)}</a>`:''}</div>
<div><label for="cn" style="font-size:.8rem;color:var(--mu)">Nombre</label><input id="cn"><label for="cm" style="font-size:.8rem;color:var(--mu);display:block;margin-top:12px">Mensaje</label><textarea id="cm" rows="4"></textarea><p><button class="btn r" id="cs">Enviar por WhatsApp</button></p></div></div></section></div>`}};
function nav(){const r=location.hash.replace(/^#\/?/,'').split('/')[0]||'inicio';
$('#nv').innerHTML=[['inicio','#/','Inicio'],['productos','#/productos','Productos'],['personalizados','#/personalizados','Personalizados'],['sobre-mi','#/sobre-mi','Sobre mí'],['contacto','#/contacto','Contacto']].map(x=>`<a href="${x[1]}" class="${r===x[0]?'on':''}">${x[2]}</a>`).join('')}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/'),v=V[p[0]||'inicio']?p[0]||'inicio':'inicio';$('#app').innerHTML=V[v](p[1]);nav();scrollTo(0,0)}
function drawCart(){const it=cart.map(c=>({c,p:D.products.find(p=>p.id===c.id)})).filter(x=>x.p),n=it.reduce((a,x)=>a+x.c.q,0);
$('#cbtn').innerHTML=ic('cart',22)+`<span class="cnt">${n}</span>`;
const known=it.length&&it.every(x=>x.p.price>0),tot=it.reduce((a,x)=>a+x.p.price*x.c.q,0);
$('#cdw').innerHTML=`<div class="ch"><b class="dsp" style="font-size:.95rem">Tu carrito</b><button class="ib" data-cl aria-label="Cerrar">${ic('x')}</button></div><div id="ci">${it.length?it.map(x=>`<div class="ci"><div><b style="font-size:.85rem">${e(x.p.name)}</b><br><small style="color:var(--mu)">${money(x.p.price)}</small></div><div class="qt"><button data-q="${e(x.p.id)}|-1">−</button>${x.c.q}<button data-q="${e(x.p.id)}|1">+</button></div></div>`).join(''):`<p style="text-align:center;color:var(--mu);margin-top:70px">Tu carrito está vacío.</p><p style="text-align:center"><a class="btn r" href="#/productos" data-cl>Ver productos</a></p>`}</div>
${it.length?`<div class="cf"><p style="display:flex;justify-content:space-between"><span>Total</span><b>${known?money(tot):'A confirmar'}</b></p><a class="btn r" style="width:100%;justify-content:center" target="_blank" rel="noopener" href="${wa('Hola! Quiero pedir:\n'+it.map(x=>`- ${x.c.q}x ${x.p.name}`).join('\n')+(known?'\nTotal: '+money(tot):''))}">Pedir por WhatsApp</a></div>`:''}`}
const open=o=>{$('#cdw').classList.toggle('on',o);$('#ov').classList.toggle('on',o)};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-add],[data-q],[data-cl],[data-vid],#cbtn,#sbtn,#ov,#cs');if(!t)return;
if(t.dataset.add){const c=cart.find(x=>x.id===t.dataset.add);c?c.q++:cart.push({id:t.dataset.add,q:1});save();drawCart();open(true)}
else if(t.dataset.q){const[a,b]=t.dataset.q.split('|'),c=cart.find(x=>x.id===a);c.q+=+b;cart=cart.filter(x=>x.q>0);save();drawCart()}
else if(t.dataset.vid){$('#dlg').innerHTML=`<video src="${e(t.dataset.vid)}" controls autoplay playsinline></video>`;$('#dlg').showModal()}
else if(t.id==='cbtn')open(true);else if(t.id==='sbtn'){$('#sb').classList.toggle('on');$('#sq').focus()}
else if(t.id==='cs'){window.open(wa(`Hola! Soy ${$('#cn').value||''}. ${$('#cm').value||''}`),'_blank')}else open(false)});
$('#dlg').addEventListener('click',ev=>{if(ev.target.id==='dlg'){ev.target.close();ev.target.innerHTML=''}});
$('#sq').addEventListener('input',ev=>{q=ev.target.value;location.hash.startsWith('#/productos')?route():location.hash='#/productos'});
addEventListener('hashchange',route);
fetch('content.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;$('#lg').innerHTML=brand(D.brand);$('#sbtn').innerHTML=ic('search',20);
const c=D.contact;$('#ft').innerHTML=`<div class="fg"><div><a class="logo" href="#/">${brand(D.brand)}</a><p style="color:var(--mu);font-size:.85rem">${e(D.footerTag)}</p>${c.ig?`<a href="https://www.instagram.com/${e(c.ig)}/" target="_blank" rel="noopener">${ic('ig')} Instagram</a>`:''}</div>
<div><h4>Navegación</h4><a href="#/productos">Productos</a><a href="#/personalizados">Personalizados</a><a href="#/sobre-mi">Sobre mí</a><a href="#/contacto">Contacto</a></div>
<div><h4>Categorías</h4>${D.categories.slice(0,5).map(x=>`<a href="#/productos/${e(x.id)}">${e(x.name)}</a>`).join('')}</div>
<div><h4>Contacto</h4><a href="${wa('Hola!')}" target="_blank" rel="noopener">${ic('wa',16)} WhatsApp: ${e(c.phone)}</a><a href="mailto:${e(c.email)}">${ic('mail',16)} Email: ${e(c.email)}</a><span>${ic('pin',16)} ${e(c.city)}</span></div></div>
<div class="cp">© ${new Date().getFullYear()} ${e(D.brand)} — Todos los derechos reservados.</div>`;
document.title=D.brand+' | Impresión 3D';drawCart();route()}).catch(()=>{$('#app').innerHTML='<div class="w" style="padding:80px 24px">No se pudo cargar el contenido.</div>'});
</script></body></html>
